{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAISON — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="navbar__logo">
      <span class="logo-text">MAISON</span>
    </div>
    <nav class="navbar__links">
      <a href="{% url 'secure:index' %}" class="nav-link">SHOP</a>
      <a href="{% url 'secure:cart' %}" class="nav-link">CART <span class="cart-count">0</span></a>
      <a href="{% url 'secure:account' %}" class="nav-link">ACCOUNT</a>
      <a href="#" class="nav-link">PAYMENT</a>
      <a href="#" class="nav-link nav-link--admin">ADMIN</a>
      <a href="{% url 'secure:login' %}" class="nav-link">LOGIN</a>
    </nav>
    <button class="navbar__mobile-toggle" aria-label="Toggle menu">☰</button>
  </header>

  <!-- HERO STRIP -->
  <div class="hero-strip">
    <p>Admin Panel</p>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    
  </main>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-msg">Added to cart!</span>
  </div>

  <script src="{% static 'js/shop.js' %}"></script>
</body>
</html>
