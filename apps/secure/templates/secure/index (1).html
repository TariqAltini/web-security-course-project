<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAISON — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="navbar__logo">
      <span class="logo-text">MAISON</span>
    </div>
    <nav class="navbar__links">
      <a href="index.html" class="nav-link">SHOP</a>
      <a href="cart.html" class="nav-link">CART <span class="cart-count">0</span></a>
      <a href="login.html" class="nav-link">ACCOUNT</a>
      <a href="#" class="nav-link">PAYMENT</a>
      <a href="#" class="nav-link nav-link--admin">ADMIN</a>
    </nav>
    <button class="navbar__mobile-toggle" aria-label="Toggle menu">☰</button>
  </header>

  <!-- HERO STRIP -->
  <div class="hero-strip">
    <p>New Collection — Spring / Summer 2026</p>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="section-header">
      <h1 class="section-title">Featured Products</h1>
      <div class="section-line"></div>
    </div>

    <!-- PRODUCT LIST -->
    <ul class="product-list">

      <!-- PRODUCT CARD -->
      <li class="product-card" onclick="window.location.href='product-detail.html'" style="cursor:pointer;">
        <div class="product-card__image-wrap">
          <img
            src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80"
            alt="Precision Watch"
            class="product-card__image"
          />
          <div class="product-card__overlay">
            <span class="overlay-label">View Details</span>
          </div>
          <div class="product-card__badge">New</div>
        </div>

        <div class="product-card__info">
          <div class="product-card__meta">
            <span class="product-card__category">Accessories</span>
          </div>
          <h2 class="product-card__name">Precision Chronograph</h2>
          <p class="product-card__desc">Swiss-movement timepiece with sapphire crystal glass and a hand-stitched leather strap.</p>
          <div class="product-card__footer">
            <span class="product-card__price">$349.00</span>
            <button class="quick-buy-btn" onclick="handleQuickBuy(this)">
              <span class="btn-text">Quick Buy</span>
              <span class="btn-icon">→</span>
            </button>
          </div>
        </div>
      </li>

    </ul>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-msg">Added to cart!</span>
  </div>

  <script src="main.js"></script>
</body>
</html>
